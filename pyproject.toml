[project]
name = "bearcar"
version = "0.2.0"
description = "Behavioral-Cloning powered autonomous driving"
readme = "README.md"
requires-python = ">=3.11"
[dependency-groups]
rpi = [
  "numpy==2.4.5",
  "opencv-python==4.13.0.92",
  "pygame==2.6.1",
  "pyserial==3.5",
  "rshell==0.0.36",
  "ruff==0.15.13",
  # "torch==2.12.0",
  # "torchvision==0.27.0",
  "torchinfo==1.8.0",
]
server = [
  "matplotlib>=3.10.3",
  "numpy>=2.4.5",
  "pandas>=3.0.1",
  "pygame>=2.6.1",
  "ruff>=0.15.13",
  # "torch>=2.12.0",
  # "torchvision>=0.27.0",
  "torchinfo>=1.8.0",
  "pyqt6>=6.11.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
cpu = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]
cu130 = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
